name: Build and release

# - Every push to main builds the module and pushes the built files to the `build` branch,
#   so the latest build can be checked without making a release.
# - Publishing a GitHub release (tag like v13.1.0) builds the module and attaches module.json and
#   module.zip to the release so Foundry can install and update from it.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run ci

      - name: Set version and URLs in module.json
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          # Accept tags like v1.2.0, V1.2.0, V.1.2.0 or 1.2.0.
          VERSION="$(echo "$TAG" | sed -E 's/^[vV]\.?//')"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg url "$REPO" \
             --arg manifest "$REPO/releases/latest/download/module.json" \
             --arg download "$REPO/releases/download/${TAG}/module.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             dist/module.json > module.json
          cp module.json dist/module.json

      - name: Build module.zip
        run: (cd dist && zip -r ../module.zip .)

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip

      - name: Push built files to the build branch
        if: github.event_name != 'release'
        run: |
          cd dist
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build
